---
# Restore the previous production image. To pick a specific build, see the
# list in the status playbook and pass it: -e netstation_rollback_build=<build id>
- name: Roll back the production image
  hosts: netstation_servers
  become: true
  tasks:
    - name: Roll back
      ansible.builtin.command:
        argv: "{{ ['/usr/local/sbin/netstation-image', 'rollback']
                  + ([netstation_rollback_build] if netstation_rollback_build | default('') | length > 0 else []) }}"
      register: netstation_rollback
      changed_when: true

    - name: Show the result
      ansible.builtin.debug:
        msg: "{{ netstation_rollback.stdout_lines | select('match', '^==> ') | list }}"
