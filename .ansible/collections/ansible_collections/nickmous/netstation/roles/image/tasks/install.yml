---
- name: Install the image build packages
  ansible.builtin.apt:
    name:
      - mmdebstrap
      - squashfs-tools
      - util-linux
    state: present
    install_recommends: false

- name: Create /etc/netstation
  ansible.builtin.file:
    path: /etc/netstation
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the netstation settings for the server tools
  ansible.builtin.template:
    src: netstation.env.j2
    dest: /etc/netstation/netstation.env
    owner: root
    group: root
    mode: "0644"

- name: Install netstation-image
  ansible.builtin.copy:
    src: netstation-image
    dest: /usr/local/sbin/netstation-image
    owner: root
    group: root
    mode: "0755"

- name: Install the scheduled staging build units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - netstation-staging-build.service
    - netstation-staging-build.timer
  register: netstation_build_units

- name: Enable the scheduled staging build
  ansible.builtin.systemd_service:
    name: netstation-staging-build.timer
    daemon_reload: "{{ netstation_build_units is changed }}"
    enabled: "{{ netstation_staging_build_enabled }}"
    state: "{{ 'started' if netstation_staging_build_enabled else 'stopped' }}"
