---
# The clients that are on right now: IP and MAC address, and the label and
# hostname from netstation_clients when they have them. Changes nothing.
- name: Show the clients that are on
  hosts: netstation_servers
  become: true
  tasks:
    - name: Find the clients
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/sbin/netstation-image clients | while read -r ip mac; do
            echo "$ip  $mac  $(/usr/local/sbin/netstation-client-name "$mac")"
        done
      args:
        executable: /bin/bash
      register: netstation_clients_on
      changed_when: false

    - name: Show the clients
      ansible.builtin.debug:
        msg: "{{ [(netstation_clients_on.stdout_lines | length) ~ ' clients on (IP, MAC, name)']
                 + netstation_clients_on.stdout_lines | map('trim') | list }}"
