---
# Build an ISO that installs Debian on a netstation server without questions.
# Runs on this machine (needs xorriso and cpio); boot the server from the
# result, then run the server playbook.
- name: Build the unattended installer ISO
  hosts: netstation_servers
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Installer ISO
      ansible.builtin.include_role:
        name: nickmous.netstation.installer
