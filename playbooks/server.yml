---
# Set up or repair a netstation server. Safe to run again at any time.
- name: Configure the netstation server
  hosts: netstation_servers
  become: true
  tasks:
    - name: LTSP server
      ansible.builtin.include_role:
        name: nickmous.netstation.server

    - name: Image tooling and scheduled staging build
      ansible.builtin.include_role:
        name: nickmous.netstation.image
        tasks_from: install

    - name: WireGuard
      ansible.builtin.include_role:
        name: nickmous.netstation.wireguard
      when: netstation_wireguard_enabled | default(false)

    - name: Cockpit
      ansible.builtin.include_role:
        name: nickmous.netstation.cockpit
      when: netstation_cockpit_enabled | default(true)

    - name: Pushover alerts
      ansible.builtin.include_role:
        name: nickmous.netstation.alerts
