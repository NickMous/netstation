---
# Settings shared by all netstation roles. Override them in your inventory.

# Image names as LTSP sees them (/srv/ltsp/images/<name>.img).
netstation_image_name: netstation
netstation_staging_image_name: "{{ netstation_image_name }}-staging"

# LTSP and netstation directories on the server.
netstation_base_dir: /srv/ltsp
netstation_tftp_dir: /srv/tftp
netstation_state_dir: /srv/netstation
netstation_releases_dir: "{{ netstation_base_dir }}/releases"

# How many previous production images to keep for rollback.
netstation_releases_keep: 3

# The account every client logs in with automatically. It exists on the
# server only, with an empty password, so its home lives in each client's RAM.
netstation_session_user: kiosk

# Debian release used for the client image.
netstation_debian_suite: trixie
netstation_debian_mirror: http://deb.debian.org/debian
netstation_debian_security_mirror: http://security.debian.org/debian-security

# Client localisation.
netstation_timezone: Etc/UTC
netstation_locale: en_US.UTF-8
netstation_keyboard_layout: us
netstation_keyboard_variant: ""

# Hide the boot messages on the clients behind a splash screen (Plymouth).
netstation_boot_splash: true

# Veyon (classroom-style monitoring and remote control) on the clients.
netstation_veyon_enabled: false
# Public keys the clients trust, e.g.:
#   - name: admin
#     key: "{{ lookup('file', 'files/veyon/admin-public.pem') }}"
netstation_veyon_public_keys: []

# Power schedule. Times use systemd's OnCalendar format in the local time
# zone, e.g. "08:45" or "Mon..Fri 08:45".
# Wake the clients with Wake-on-LAN: those in netstation_clients and every
# client that booted from this server before. A client in netstation_clients
# with its own `wake` list is woken at those times instead.
netstation_power_wake: []
# Switch clients off when nobody is using them:
#   - at: "10:00"             # not used since it was switched on
#   - at: "18:30"
#     idle_minutes: 15        # or: no keyboard or mouse input for 15 minutes
netstation_power_off: []
# Send a Pushover alert listing the clients that are still on.
netstation_power_report: []

# Remote Mac: people control their own Mac from a client with RustDesk, on
# the client's keyboard, mouse and screens. Runs a RustDesk ID and relay
# server on this server (rustdesk_server role) and puts the RustDesk client
# and a "Mac" desktop icon in the image (image role).
netstation_remote_mac_enabled: false
# The address the clients and the Macs use for the RustDesk server.
netstation_remote_mac_server_address: "{{ ansible_facts['default_ipv4']['address'] }}"
# Networks that may use the RustDesk server: the clients and the Macs. The
# first one also tells the server which connections are on the LAN, so it
# connects those directly instead of through the relay.
netstation_remote_mac_networks:
  - "{{ ansible_facts['default_ipv4']['network'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"
