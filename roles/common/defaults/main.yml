---
# Settings shared by all netstation roles. Override them in your inventory.

# Image names as LTSP sees them (/srv/ltsp/images/<name>.img).
netstation_image_name: netstation
netstation_staging_image_name: "{{ netstation_image_name }}-staging"

# LTSP and netstation directories on the server.
netstation_base_dir: /srv/ltsp
netstation_tftp_dir: /srv/tftp
netstation_state_dir: /srv/netstation
netstation_releases_dir: "{{ netstation_base_dir }}/releases"

# How many previous production images to keep for rollback.
netstation_releases_keep: 3

# The account every client logs in with automatically. It exists on the
# server only, with an empty password, so its home lives in each client's RAM.
netstation_session_user: kiosk

# Debian release used for the client image.
netstation_debian_suite: trixie
netstation_debian_mirror: http://deb.debian.org/debian
netstation_debian_security_mirror: http://security.debian.org/debian-security

# Client localisation.
netstation_timezone: Etc/UTC
netstation_locale: en_US.UTF-8
netstation_keyboard_layout: us
netstation_keyboard_variant: ""

# Veyon (classroom-style monitoring and remote control) on the clients.
netstation_veyon_enabled: false
# Public keys the clients trust, e.g.:
#   - name: admin
#     key: "{{ lookup('file', 'files/veyon/admin-public.pem') }}"
netstation_veyon_public_keys: []
