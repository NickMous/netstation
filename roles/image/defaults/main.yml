---
# --- What the clients run ---------------------------------------------------

# The page the browser opens on login.
netstation_homepage: about:blank

# Image file on the Ansible controller to use as the desktop background.
# Empty keeps the Debian default.
netstation_wallpaper: ""

# A PNG picture on the Ansible controller that fills the screen while the
# client boots, with a spinner. Empty shows the computer maker's logo, or
# Debian's spinner. Needs netstation_boot_splash.
netstation_boot_splash_image: ""

# GPU drivers to keep in the initrd for the boot splash: i915, xe, amdgpu,
# radeon and/or nouveau. Empty keeps them all, about 100 MB with firmware,
# downloaded at every boot. A client with another GPU still works, but shows
# the splash late or as text.
netstation_initrd_gpu_drivers: []

netstation_numlock: true

# Keep Wake-on-LAN armed on the clients' network cards. The BIOS/UEFI of each
# client must allow it too. Wake clients with the wake playbook.
netstation_wake_on_lan: true

# Show the client's name and IP address in the panel, next to the clock.
netstation_panel_show_address: true

# Shortcuts on the desktop that open a web page in Firefox:
#   - name: HD Cloud
#     url: https://www.hdcloud.nl/
#     icon: firefox-esr        # optional: an icon name or an icon file path
netstation_desktop_shortcuts: []

# Log the session out after this many minutes without keyboard or mouse
# input, so the next person gets a fresh desktop. 0 turns it off. An RDP
# session only disconnects and can be resumed.
netstation_idle_logout_minutes: 0
# How long before the logout a warning appears; any input cancels it.
netstation_idle_logout_warning_seconds: 60
netstation_idle_logout_message: >-
  You will be logged out soon because nobody has used this computer for a
  while. Move the mouse or press a key to stay logged in.

# What the Remote Desktop dialogs say, e.g. in the language of the site. Set
# all of them when you change one.
netstation_rdp_messages:
  title: Remote Desktop
  wrong_password: The password is wrong. Check it and try again.
  crashed: Remote Desktop closed unexpectedly. Try again; if it keeps happening, tell IT.
  account_blocked: Your account is locked or disabled. Ask IT to unlock it.
  password_expired: Your password has expired. Ask IT to reset it.
  unreachable: Can't reach the remote computer. Try again in a few minutes; if it keeps happening, tell IT.
  failed: The connection failed. Try again; if it keeps happening, tell IT.

# Extra options for xfreerdp3, after the .rdp file and the password.
netstation_rdp_options:
  - /cert:tofu

# Pass these through into RDP sessions:
#   sound:      the session's audio plays on the client
#   usb_drives: USB sticks plugged into the client show up as drives
#   printers:   printers the client knows (driverless USB printers via
#               ipp-usb, and network printers it discovers)
netstation_rdp_sound: false
netstation_rdp_usb_drives: false
netstation_rdp_printers: false

# Firefox's own language, e.g. "nl" or "de" (installs firefox-esr-l10n-<language>).
# Empty keeps English. The rest of the desktop follows netstation_locale.
netstation_firefox_language: ""

# Firefox enterprise policies merged over the defaults
# (https://mozilla.github.io/policy-templates/).
netstation_firefox_policies: {}

# Time servers for the clients, e.g. a Windows domain controller. Empty uses
# Debian's public NTP pool.
netstation_ntp_servers: []

# --- Packages ---------------------------------------------------------------

netstation_image_components:
  - main
  - contrib
  - non-free-firmware

# Recommended packages are left out to keep the image small; everything the
# clients need is listed explicitly below.
netstation_image_install_recommends: false

netstation_image_packages_system:
  - linux-image-amd64
  - initramfs-tools
  - systemd-sysv
  - udev
  - dbus
  - kmod
  - iproute2
  - ltsp
  - nfs-common
  - sshfs
  - openssh-server
  - sudo
  - locales
  - tzdata
  - keyboard-configuration
  - console-setup
  - ca-certificates
  # Checking in with the server (netstation-heartbeat).
  - curl
  # Keeps the clock right; RDP logins (NLA) and HTTPS fail when it drifts.
  - systemd-timesyncd

netstation_image_packages_firmware:
  - firmware-linux-free
  - firmware-misc-nonfree
  - firmware-intel-graphics
  - firmware-amd-graphics
  - firmware-realtek

netstation_image_packages_desktop:
  - xserver-xorg-core
  - xserver-xorg-input-libinput
  - lightdm
  - lightdm-gtk-greeter
  - xfce4-session
  - xfwm4
  - xfdesktop4
  - xfce4-panel
  - xfce4-settings
  - xfce4-terminal
  - thunar
  - dbus-user-session
  # Lets the user at the client shut down and restart it from the desktop.
  - polkitd
  - adwaita-icon-theme
  - fonts-dejavu-core
  - desktop-base
  - pipewire-audio
  - numlockx
  - xdg-utils
  - shared-mime-info
  - desktop-file-utils

netstation_image_packages_apps:
  - firefox-esr
  - freerdp3-x11
  - zenity

netstation_image_packages_veyon:
  - veyon-service

# Site-specific additions.
netstation_image_extra_packages: []

# Folder on the Ansible controller copied over the image root last, e.g.
# files/rootfs/etc/foo.conf ends up as /etc/foo.conf on every client.
netstation_image_files_dir: ""

# --- Build ------------------------------------------------------------------

netstation_squashfs_params: "-comp zstd"

# Build a fresh staging image on a schedule (systemd OnCalendar syntax).
# Promoting it to production stays a manual step.
netstation_staging_build_enabled: true
netstation_staging_build_schedule: "Sun *-*-* 03:00:00"
