---
netstation_wallpaper_file: "wallpaper{{ netstation_wallpaper | splitext | last }}"

netstation_image_packages: >-
  {{ (netstation_image_packages_system
      + netstation_image_packages_firmware
      + netstation_image_packages_desktop
      + netstation_image_packages_apps
      + (netstation_image_packages_veyon if netstation_veyon_enabled else [])
      + (['firefox-esr-l10n-' ~ netstation_firefox_language] if netstation_firefox_language | length > 0 else [])
      + (['xfce4-genmon-plugin'] if netstation_panel_show_address else [])
      + (['ethtool'] if netstation_wake_on_lan else [])
      + (['plymouth', 'plymouth-themes'] if netstation_boot_splash else [])
      + (['cups-daemon', 'ipp-usb', 'avahi-daemon'] if netstation_rdp_printers else [])
      + (['xprintidle'] if netstation_idle_logout_minutes | int > 0 or netstation_power_off | length > 0 else [])
      + netstation_image_extra_packages) | unique }}

# The kernel modules of each GPU driver netstation_initrd_gpu_drivers can keep.
netstation_gpu_driver_modules:
  i915: [i915, kvmgt]
  xe: [xe]
  amdgpu: [amdgpu, amdxcp]
  radeon: [radeon]
  nouveau: [nouveau]

# Files rendered into the image; dest is relative to the image root.
netstation_rootfs_templates:
  - dest: etc/default/keyboard
  - dest: etc/lightdm/lightdm.conf.d/70-netstation.conf
  - dest: etc/xdg/autostart/netstation-browser.desktop
  - dest: etc/xdg/autostart/netstation-numlock.desktop
    when: "{{ netstation_numlock }}"
  - dest: etc/xdg/mimeapps.list
  - dest: etc/systemd/timesyncd.conf.d/netstation.conf
    when: "{{ netstation_ntp_servers | length > 0 }}"
  - dest: etc/xdg/xfce4/panel/default.xml
    when: "{{ netstation_panel_show_address }}"
  - dest: etc/xdg/xfce4/panel/genmon-19.rc
    when: "{{ netstation_panel_show_address }}"
  - dest: usr/local/bin/netstation-panel-address
    mode: "0755"
    when: "{{ netstation_panel_show_address }}"
  - dest: etc/xdg/autostart/netstation-idle-logout.desktop
    when: "{{ netstation_idle_logout_minutes | int > 0 }}"
  - dest: usr/local/bin/netstation-idle-logout
    mode: "0755"
    when: "{{ netstation_idle_logout_minutes | int > 0 }}"
  - dest: usr/share/plymouth/themes/netstation/netstation.plymouth
    when: "{{ netstation_boot_splash and netstation_boot_splash_image | length > 0 }}"
  - dest: usr/share/plymouth/themes/netstation/netstation.script
    when: "{{ netstation_boot_splash and netstation_boot_splash_image | length > 0 }}"
  - dest: etc/initramfs-tools/hooks/netstation-gpu-drivers
    mode: "0755"
    when: "{{ netstation_boot_splash and netstation_initrd_gpu_drivers | length > 0 }}"
  - dest: usr/share/mime/packages/netstation-rdp.xml
  - dest: usr/share/applications/netstation-rdp.desktop
  - dest: usr/lib/firefox-esr/distribution/policies.json
  - dest: etc/udev/rules.d/90-netstation-usb-drives.rules
    when: "{{ netstation_rdp_usb_drives }}"
  - dest: usr/local/sbin/netstation-usb-mount
    mode: "0755"
    when: "{{ netstation_rdp_usb_drives }}"
  - dest: usr/local/sbin/netstation-activity
    mode: "0755"
    when: "{{ netstation_power_off | length > 0 }}"
  - dest: etc/systemd/system/netstation-activity.service
    when: "{{ netstation_power_off | length > 0 }}"
  - dest: usr/local/sbin/netstation-power-off-if-idle
    mode: "0755"
    when: "{{ netstation_power_off | length > 0 }}"
  - dest: etc/systemd/system/netstation-power-off@.service
    when: "{{ netstation_power_off | length > 0 }}"
  - dest: usr/local/sbin/netstation-heartbeat
    mode: "0755"
  - dest: etc/systemd/system/netstation-heartbeat.service
  - dest: etc/systemd/system/netstation-heartbeat.timer
  - dest: usr/local/bin/netstation-rdp-open
    mode: "0755"
  - dest: usr/local/bin/netstation-report
    mode: "0755"
  - dest: usr/local/sbin/netstation-reset-home
    mode: "0755"
  - dest: usr/local/sbin/netstation-image-setup
    mode: "0755"
  - dest: usr/local/sbin/netstation-wol
    mode: "0755"
    when: "{{ netstation_wake_on_lan }}"
  - dest: etc/systemd/system/netstation-wol.service
    when: "{{ netstation_wake_on_lan }}"

# Options for xfreerdp3 from the pass-through settings.
netstation_rdp_redirect_options: >-
  {{ (['/sound'] if netstation_rdp_sound else [])
     + (['/drive:hotplug,*'] if netstation_rdp_usb_drives else [])
     + (['/printer'] if netstation_rdp_printers else []) }}
