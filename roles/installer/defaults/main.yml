---
# Builds an ISO that installs Debian on a netstation server without any
# questions. Runs on the Ansible controller; needs xorriso and cpio there.

# Where the official netinst ISO comes from, and where files are stored.
netstation_installer_iso_mirror: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd
netstation_installer_build_dir: "{{ inventory_dir }}/../build"
netstation_installer_output: "{{ netstation_installer_build_dir }}/{{ inventory_hostname }}.iso"

netstation_installer_hostname: "{{ inventory_hostname }}"
netstation_installer_domain: ""

# The admin account. The password is required; keep it in your vault.
netstation_installer_admin_user: "{{ ansible_user | default('admin') }}"
netstation_installer_admin_password: ""
# Public key files allowed to log in as the admin (default: your own keys).
netstation_installer_ssh_key_files: >-
  {{ query('ansible.builtin.fileglob', lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_*.pub') }}

# The network card the installer uses ("auto" = the first one with a link).
netstation_installer_interface: auto
# dhcp, or static with the settings below.
netstation_installer_network: dhcp
netstation_installer_address: ""
netstation_installer_netmask: 255.255.255.0
netstation_installer_gateway: ""
netstation_installer_nameservers: []

# Extra network cards with a fixed address, e.g. a separate client network:
#   - name: enp0s8
#     address: 192.168.67.1/24
netstation_installer_extra_interfaces: []

netstation_installer_locale: en_US.UTF-8
