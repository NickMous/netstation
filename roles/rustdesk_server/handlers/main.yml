---
# Not in a dry run on a server without RustDesk yet: there's nothing to
# restart.
- name: Restart the RustDesk server
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - rustdesk-hbbs
    - rustdesk-hbbr
  when: not ansible_check_mode or (netstation_rustdesk_installed.stat.exists | default(true))
