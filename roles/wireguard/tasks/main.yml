---
- name: Check the WireGuard settings
  ansible.builtin.assert:
    that:
      - netstation_wireguard_private_key | length > 0
    fail_msg: Set netstation_wireguard_private_key (in your vault) before enabling WireGuard.

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard-tools
      - nftables
    state: present
    install_recommends: false

- name: Enable IP forwarding
  ansible.builtin.copy:
    content: "net.ipv4.ip_forward = 1\n"
    dest: /etc/sysctl.d/90-netstation-forward.conf
    owner: root
    group: root
    mode: "0644"
  when: netstation_wireguard_masquerade
  notify: Apply sysctl settings

- name: Write the WireGuard configuration
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ netstation_wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Reload WireGuard

- name: Enable WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ netstation_wireguard_interface }}"
    enabled: true
    state: started
